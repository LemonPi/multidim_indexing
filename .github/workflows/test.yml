name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[all,test]"

      - name: Run tests
        run: pytest tests/test_torch_view.py tests/test_numpy_view.py tests/test_optimization_coverage.py -v -k "not test_interpolation or test_linear_interpolation or test_numpy_linear"
